<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#059669" />
    <meta name="description" content="Synapsed turns customer feedback into a prioritised, evidence-backed roadmap." />
    <title>Synapsed</title>
    <script>
      // Set the theme before first paint so a dark-mode user never sees a white flash.
      try {
        var stored = JSON.parse(localStorage.getItem('synapsed-theme') || 'null');
        var mode = stored && stored.state && stored.state.theme;
        if (!mode) mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = mode;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
